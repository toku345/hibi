name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      LANG: C.UTF-8
    steps:
      - name: ソースコードの取得
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: OCaml環境の準備
        uses: ocaml/setup-ocaml@93303b622b2522e4411e295f9e77411a24912ac7 # v3.9.0
        with:
          ocaml-compiler: "5.4.1"

      - name: 実行環境の確認
        run: |
          python3 --version
          opam --version
          opam exec -- ocamlc -version

      - name: テストを含む依存関係の導入
        run: opam install . --deps-only --with-test --yes

      - name: Duneバージョンの確認
        run: opam exec -- dune --version

      - name: ビルド
        run: opam exec -- dune build @install

      - name: OCaml・端末入力テスト
        run: opam exec -- dune runtest --force
